services:

  films1:
    build: .
    image: film-app

    environment:
      MAX_FILMS: 5
      DATE_FILE_PATH: "/app/data/films.json"

    ports:
      - "8081:8080"

    volumes:
      - ./data/films.json:/app/data/films.json

  films2:
    build: .
    image: film-app

    environment:
      MAX_FILMS: 4
      DATE_FILE_PATH: "/app/data/films.json"

    ports:
      - "8082:8080"

    volumes:
      - ./data/films.json:/app/data/films.json
