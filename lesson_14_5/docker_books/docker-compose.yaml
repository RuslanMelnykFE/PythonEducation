services:

  books1:
    build: .
    image: books-app

    environment:
      MAX_BOOKS: 5
      DATA_FILE_PATH: "/app/data/books.json"

    ports:
      - "8081:8080"

    volumes:
      - ./data/books.json:/app/data/books.json

  books2:
    build: .
    image: books-app

    environment:
      MAX_BOOKS: 6
      DATA_FILE_PATH: "/app/data/books.json"

    ports:
      - "8082:8080"

    volumes:
      - ./data/books.json:/app/data/books.json

  books3:
    build: .
    image: books-app

    environment:
      MAX_BOOKS: 7
      DATA_FILE_PATH: "/app/data/books.json"

    ports:
      - "8083:8080"

    volumes:
      - ./data/books.json:/app/data/books.json
